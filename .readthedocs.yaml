version: 2
build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  # The build image provides pandoc (for nbsphinx) and a C/C++ toolchain with zlib for the
  # extension modules, which hatch builds when it installs the package into the docs env.
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        - uvx hatch run docs:build
        - mv docs/_build $READTHEDOCS_OUTPUT
